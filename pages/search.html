<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Search — UMAR_CREATION</title><link rel="stylesheet" href="../assets/style.css"><link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css"><script src="../data/site-data.js"></script></head><body><div id="header"></div><main class="section"><div class="container"><h1>Search</h1><div class="toolbar"><input id="q" placeholder="Search..."></div><div id="results" class="grid"></div></div></main><script src="../assets/script.js"></script><script>fetch('_head.html').then(r=>r.text()).then(x=>document.querySelector('#header').innerHTML=x).then(()=>{const p=new URLSearchParams(location.search);q.value=p.get('q')||'';function run(){const s=q.value.toLowerCase();const all=[...SITE_DATA.aiTools.map(x=>({t:x.name,d:x.desc,u:x.url})),...SITE_DATA.prompts.map(x=>({t:x.title,d:x.text,u:'prompts.html'}))];results.innerHTML=all.filter(x=>(x.t+x.d).toLowerCase().includes(s)).map(x=>`<a class="card" href="${x.u}" target="_blank"><h3>${x.t}</h3><p>${x.d}</p></a>`).join('')||'<div class="notice">No result found.</div>'}run();q.oninput=run})</script></body></html>
