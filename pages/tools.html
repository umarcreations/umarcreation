<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Free Online Tools — UMAR_CREATION</title><link rel="icon" href="../assets/logo.png"><link rel="stylesheet" href="../assets/style.css"><link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css"></head><body><div id="header"></div><main><section class="page-hero"><div class="container"><span class="eyebrow">FREE TOOLS</span><h1>Useful tools. No signup.</h1><p>Run simple tools directly in your browser.</p><div class="toolbar"><input id="filter" placeholder="Search free tools..."></div><div class="grid" id="tools"></div></div></section></main><footer class="footer"><div class="container copyright"><span>© 2026 UMAR_CREATION</span><span>Modern digital products, useful tools and innovative solutions.</span></div></footer><button class="floating-top"><i class="fa-solid fa-arrow-up"></i></button><script src="../data/site-data.js"></script><script src="../assets/script.js"></script><script>fetch('_head.html').then(r=>r.text()).then(x=>document.querySelector('#header').innerHTML=x).then(()=>{const t=[['Image Compressor','Compress images locally.','image-compressor.html','fa-file-image'],['Image Resizer','Resize images locally.','image-resizer.html','fa-expand'],['Word Counter','Words, characters and lines.','word-counter.html','fa-file-lines'],['Password Generator','Generate secure passwords.','password-generator.html','fa-key'],['QR Code Generator','Make QR codes from text or links.','qr-generator.html','fa-qrcode'],['Text Formatter','Uppercase, lowercase, trim and clean.','text-formatter.html','fa-font']];function r(q=''){document.querySelector('#tools').innerHTML=t.filter(x=>x[0].toLowerCase().includes(q.toLowerCase())).map(x=>`<a class="card" href="${x[2]}"><div class="tool-icon"><i class="fa-solid ${x[3]}"></i></div><h3>${x[0]}</h3><p>${x[1]}</p><div class="card-row"><span class="badge">FREE</span><i class="fa-solid fa-arrow-right"></i></div></a>`).join('')}r();document.querySelector('#filter').oninput=e=>r(e.target.value);document.querySelector('[data-theme-toggle]').onclick=()=>{document.documentElement.dataset.theme=document.documentElement.dataset.theme==='dark'?'light':'dark';localStorage.setItem('uc-theme',document.documentElement.dataset.theme)}});</script></body></html>
