<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>AI Prompt Library — UMAR_CREATION</title><link rel="stylesheet" href="../assets/style.css"><link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css"><script src="../data/site-data.js"></script></head><body><div id="header"></div><main><section class="page-hero"><div class="container"><span class="eyebrow">PROMPT LIBRARY</span><h1>Copy-ready AI Prompts</h1><p>Add only title, tag and prompt text in <b>data/site-data.js</b>.</p><div class="toolbar"><input id="filter" placeholder="Search prompts..."></div><div class="grid" id="list"></div></div></section></main><script src="../assets/script.js"></script><script>fetch('_head.html').then(r=>r.text()).then(x=>document.querySelector('#header').innerHTML=x).then(()=>{function r(q=''){document.querySelector('#list').innerHTML=SITE_DATA.prompts.filter(x=>(x.title+x.tag+x.text).toLowerCase().includes(q.toLowerCase())).map(x=>`<div class="card"><span class="badge">${x.tag}</span><h3 style="margin-top:12px">${x.title}</h3><p>${x.text}</p><div class="card-row"><button class="btn btn-primary" onclick='copyText(${JSON.stringify(x.text)})'><i class="fa-regular fa-copy"></i> Copy Prompt</button></div></div>`).join('')}r();document.querySelector('#filter').oninput=e=>r(e.target.value)})</script></body></html>
