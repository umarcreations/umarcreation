<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Free AI Tools — UMAR_CREATION</title><link rel="stylesheet" href="../assets/style.css"><link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css"><script src="../data/site-data.js"></script></head><body><div id="header"></div><main><section class="page-hero"><div class="container"><span class="eyebrow">AI DIRECTORY</span><h1>Free AI Tools</h1><p>To add another AI tool, open <b>data/site-data.js</b> and paste name + link + text.</p><div class="toolbar"><input id="filter" placeholder="Search AI tools..."></div><div class="grid" id="list"></div></div></section></main><footer class="footer"><div class="container copyright"><span>© 2026 UMAR_CREATION</span><span>All links open in a new page.</span></div></footer><button class="floating-top"><i class="fa-solid fa-arrow-up"></i></button><script src="../assets/script.js"></script><script>fetch('_head.html').then(r=>r.text()).then(x=>document.querySelector('#header').innerHTML=x).then(()=>{function r(q=''){document.querySelector('#list').innerHTML=SITE_DATA.aiTools.filter(x=>(x.name+x.category+x.desc).toLowerCase().includes(q.toLowerCase())).map(x=>`<a class="card" href="${x.url}" target="_blank" rel="noopener"><div class="tool-icon"><i class="fa-solid ${x.icon}"></i></div><h3>${x.name}</h3><p>${x.desc}</p><div class="card-row"><span class="tiny">${x.category}</span><span class="badge">${x.free?'FREE':'PAID'}</span></div></a>`).join('')}r();document.querySelector('#filter').oninput=e=>r(e.target.value)})</script></body></html>
