<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Digital Products — UMAR_CREATION</title><link rel="stylesheet" href="../assets/style.css"><link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css"><script src="../data/site-data.js"></script></head><body><div id="header"></div><main><section class="page-hero"><div class="container"><span class="eyebrow">DIGITAL STORE</span><h1>Premium Digital Products</h1><p>Products are connected to the order links you set in the data file.</p><div class="product-grid" id="list"></div><div class="notice" style="margin-top:25px"><b>Payment note:</b> For real online card/mobile-wallet checkout, connect a payment gateway/backend later. The current Buy button can use WhatsApp or any payment URL you paste.</div></div></section></main><script src="../assets/script.js"></script><script>fetch('_head.html').then(r=>r.text()).then(x=>document.querySelector('#header').innerHTML=x).then(()=>{document.querySelector('#list').innerHTML=SITE_DATA.products.map(x=>`<div class="card"><div class="product-media">${x.image?`<img src="${x.image}" style="width:100%;height:100%;object-fit:cover;border-radius:15px">`:'<i class="fa-solid fa-box-open"></i>'}</div><div class="card-row"><span class="badge">${x.badge}</span><span><span class="old">${x.old}</span> <span class="price">${x.price}</span></span></div><h3>${x.name}</h3><a class="btn btn-primary" style="width:100%" href="${x.url}" target="_blank" rel="noopener"><i class="fa-solid fa-cart-shopping"></i> Buy / Order</a></div>`).join('')})</script></body></html>
