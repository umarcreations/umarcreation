<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Tutorials — UMAR_CREATION</title><link rel="stylesheet" href="../assets/style.css"><link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css"><script src="../data/site-data.js"></script></head><body><div id="header"></div><main><section class="page-hero"><div class="container"><span class="eyebrow">TUTORIALS & ARTICLES</span><h1>Learn something useful.</h1><div class="grid" id="list"></div></div></section></main><script src="../assets/script.js"></script><script>fetch('_head.html').then(r=>r.text()).then(x=>document.querySelector('#header').innerHTML=x).then(()=>document.querySelector('#list').innerHTML=SITE_DATA.articles.map(x=>`<a class="card" href="${x.url}">${x.image?`<img src="${x.image}" style="aspect-ratio:16/9;object-fit:cover;border-radius:12px;margin-bottom:14px">`:'<div class="product-media" style="margin-bottom:14px"><i class="fa-solid fa-newspaper"></i></div>'}<span class="badge">${x.tag}</span><h3 style="margin-top:10px">${x.title}</h3><div class="card-row"><span class="tiny">Read article</span><i class="fa-solid fa-arrow-right"></i></div></a>`).join(''))</script></body></html>
