<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Image Compressor — UMAR_CREATION</title><link rel="stylesheet" href="../assets/style.css"><link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css"></head><body><div id="header"></div><main class="section"><div class="container tool-page"><a class="btn btn-soft" href="../pages/tools.html">← Back to tools</a><h1>Image Compressor</h1><p class="notice">Your image stays in the browser. Nothing is uploaded to a server.</p><div class="toolbox"><input id="file" type="file" accept="image/*"><div class="row" style="margin-top:12px"><label>Quality <input id="quality" type="range" min="0.1" max="1" step="0.05" value="0.75"></label><label>Format <select id="format"><option value="image/jpeg">JPG</option><option value="image/webp">WebP</option><option value="image/png">PNG</option></select></label></div><div id="result"></div></div></div></main><script src="../assets/script.js"></script><script>fetch('../pages/_head.html').then(r=>r.text()).then(x=>document.querySelector('#header').innerHTML=x);let out=null;file.onchange=e=>{const f=e.target.files[0];if(!f)return;const im=new Image();im.onload=()=>{const c=document.createElement('canvas');c.width=im.width;c.height=im.height;c.getContext('2d').drawImage(im,0,0);c.toBlob(b=>{out=URL.createObjectURL(b);result.innerHTML=`<p>Original: ${(f.size/1024).toFixed(1)} KB • New: ${(b.size/1024).toFixed(1)} KB</p><img class="preview" src="${out}"><a class="btn btn-primary" download="compressed-image.${format.value==='image/png'?'png':format.value==='image/webp'?'webp':'jpg'}" href="${out}">Download</a>`},format.value,Number(quality.value))};im.src=URL.createObjectURL(f)};quality.oninput=()=>file.dispatchEvent(new Event('change'));format.onchange=()=>file.dispatchEvent(new Event('change'));</script></body></html>
