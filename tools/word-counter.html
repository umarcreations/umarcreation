<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Word Counter — UMAR_CREATION</title><link rel="stylesheet" href="../assets/style.css"><link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css"></head><body><div id="header"></div><main class="section"><div class="container tool-page"><a class="btn btn-soft" href="../pages/tools.html">← Back</a><h1>Word Counter</h1><div class="toolbox"><textarea id="text" rows="14" placeholder="Paste or type your text..."></textarea><div class="feature-grid" style="margin-top:15px"><div class="feature"><b id="words">0</b><br><span class="tiny">Words</span></div><div class="feature"><b id="chars">0</b><br><span class="tiny">Characters</span></div><div class="feature"><b id="lines">0</b><br><span class="tiny">Lines</span></div></div></div></div></main><script src="../assets/script.js"></script><script>fetch('../pages/_head.html').then(r=>r.text()).then(x=>document.querySelector('#header').innerHTML=x);text.oninput=()=>{const v=text.value;words.textContent=v.trim()?v.trim().split(/\s+/).length:0;chars.textContent=v.length;lines.textContent=v?v.split(/\n/).length:0}</script></body></html>
