<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Image Resizer — UMAR_CREATION</title><link rel="stylesheet" href="../assets/style.css"><link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css"></head><body><div id="header"></div><main class="section"><div class="container tool-page"><a class="btn btn-soft" href="../pages/tools.html">← Back</a><h1>Image Resizer</h1><div class="toolbox"><input id="file" type="file" accept="image/*"><div class="row" style="margin-top:12px"><input id="w" type="number" placeholder="Width"><input id="h" type="number" placeholder="Height"></div><label><input id="lock" type="checkbox" checked> Keep aspect ratio</label><button class="btn btn-primary" id="go" style="margin-top:12px">Resize & Download</button><div id="result"></div></div></div></main><script src="../assets/script.js"></script><script>fetch('../pages/_head.html').then(r=>r.text()).then(x=>document.querySelector('#header').innerHTML=x);let im=new Image(),ratio=1;file.onchange=e=>{const f=e.target.files[0];if(!f)return;im.onload=()=>{w.value=im.width;h.value=im.height;ratio=im.width/im.height};im.src=URL.createObjectURL(f)};w.oninput=()=>{if(lock.checked)h.value=Math.round(w.value/ratio)};h.oninput=()=>{if(lock.checked)w.value=Math.round(h.value*ratio)};go.onclick=()=>{if(!im.src)return;const c=document.createElement('canvas');c.width=+w.value;c.height=+h.value;c.getContext('2d').drawImage(im,0,0,c.width,c.height);const u=c.toDataURL('image/png');result.innerHTML=`<img class="preview" src="${u}"><a class="btn btn-primary" download="resized-image.png" href="${u}">Download</a>`};</script></body></html>
