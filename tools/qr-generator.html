<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>QR Code Generator — UMAR_CREATION</title><link rel="stylesheet" href="../assets/style.css"><link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css"><script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script></head><body><div id="header"></div><main class="section"><div class="container tool-page"><a class="btn btn-soft" href="../pages/tools.html">← Back</a><h1>QR Code Generator</h1><div class="toolbox"><input id="text" placeholder="Paste URL or text"><button class="btn btn-primary" id="go" style="margin-top:12px">Generate QR</button><div id="qr" style="background:#fff;padding:20px;display:inline-block;margin-top:20px"></div></div></div></main><script src="../assets/script.js"></script><script>fetch('../pages/_head.html').then(r=>r.text()).then(x=>document.querySelector('#header').innerHTML=x);go.onclick=()=>{qr.innerHTML='';new QRCode(qr,{text:text.value||'https://umarcreation.xyz',width:240,height:240})}</script></body></html>
