<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Password Generator — UMAR_CREATION</title><link rel="stylesheet" href="../assets/style.css"><link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css"></head><body><div id="header"></div><main class="section"><div class="container tool-page"><a class="btn btn-soft" href="../pages/tools.html">← Back</a><h1>Password Generator</h1><div class="toolbox"><label>Length <input id="len" type="number" min="6" max="128" value="20"></label><label><input id="upper" type="checkbox" checked> Uppercase</label><label><input id="num" type="checkbox" checked> Numbers</label><label><input id="sym" type="checkbox" checked> Symbols</label><button class="btn btn-primary" id="go">Generate</button><div class="result"><input id="out" readonly></div><button class="btn btn-soft" onclick="copyText(out.value)">Copy</button></div></div></main><script src="../assets/script.js"></script><script>fetch('../pages/_head.html').then(r=>r.text()).then(x=>document.querySelector('#header').innerHTML=x);go.onclick=()=>{let chars='abcdefghijklmnopqrstuvwxyz';if(upper.checked)chars+='ABCDEFGHIJKLMNOPQRSTUVWXYZ';if(num.checked)chars+='0123456789';if(sym.checked)chars+='!@#$%^&*()_+-=[]{}';let s='';const a=new Uint32Array(+len.value);crypto.getRandomValues(a);for(let i=0;i<a.length;i++)s+=chars[a[i]%chars.length];out.value=s};go.click()</script></body></html>
