<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Text Formatter — UMAR_CREATION</title><link rel="stylesheet" href="../assets/style.css"><link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css"></head><body><div id="header"></div><main class="section"><div class="container tool-page"><a class="btn btn-soft" href="../pages/tools.html">← Back</a><h1>Text Formatter</h1><div class="toolbox"><textarea id="text" rows="12" placeholder="Paste text..."></textarea><div class="toolbar"><button class="btn btn-soft" onclick="text.value=text.value.toUpperCase()">UPPER</button><button class="btn btn-soft" onclick="text.value=text.value.toLowerCase()">lower</button><button class="btn btn-soft" onclick="text.value=text.value.trim().replace(/\s+/g,' ')">Clean spaces</button><button class="btn btn-primary" onclick="copyText(text.value)">Copy</button></div></div></div></main><script src="../assets/script.js"></script><script>fetch('../pages/_head.html').then(r=>r.text()).then(x=>document.querySelector('#header').innerHTML=x)</script></body></html>
